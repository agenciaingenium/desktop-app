name: Release Candidate
on:
  push: 
    tags:
      - 'v*-b*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  Linux:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ELECTRON_DISABLE_SANDBOX: "1"
      ELECTRON_NO_SANDBOX: "1"
      DBUS_SESSION_BUS_ADDRESS: "unix:path=/dev/null"
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@master
      - uses: actions/setup-node@master
        with:
          node-version: "18"
          cache: "yarn"
      - name: Sync app version with release tag
        run: node ./scripts/sync-release-version.js "${GITHUB_REF_NAME}"
      # See https://github.com/nodejs/node-gyp/blob/main/docs/Force-npm-to-use-global-node-gyp.md
      # https://github.com/nodejs/node-gyp/blob/main/docs/Updating-npm-bundled-node-gyp.md
      # - name: Update node-gyp
      #   run: |
      #     npm install --global node-gyp@8.x
      #     npm config set node_gyp $(npm prefix -g)/lib/node_modules/node-gyp/bin/node-gyp.js
      - name: Install dependencies
        run: yarn install --immutable
      - name: Pre-release stability checks
        run: yarn pre-release:check
      - name: Build and Release
        run: |
          if [ -n "${CSC_LINK:-}" ] && [ -n "${CSC_KEY_PASSWORD:-}" ]; then
            yarn release
          else
            echo "Code signing secrets are missing/invalid; building unsigned macOS artifacts."
            unset CSC_LINK CSC_KEY_PASSWORD CSC_NAME
            CSC_IDENTITY_AUTO_DISCOVERY=false yarn release
          fi

  MacOs:
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      AC_USERNAME: ${{ secrets.AC_USERNAME }}
      AC_PASSWORD: ${{ secrets.AC_PASSWORD }}
      AC_TEAM_ID: ${{ secrets.AC_TEAM_ID }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@master
      - uses: actions/setup-node@master
        with:
          node-version: "18"
          cache: "yarn"
      - name: Configure Node
        run: |
          # npm v9 doesn't allow custom config parameters (i.e. node_gyp) anymode, so we have to downgrade it to v8
          npm install -g npm@8  
          npm install -g node-gyp@latest
          npm config set node_gyp $(npm prefix -g)/lib/node_modules/node-gyp/bin/node-gyp.js
      - name: Sync app version with release tag
        run: node ./scripts/sync-release-version.js "${GITHUB_REF_NAME}"
      - name: Install dependencies
        run: yarn install --immutable
      - name: Build and Release
        run: |
          if [ -n "${CSC_LINK:-}" ] && [ -n "${CSC_KEY_PASSWORD:-}" ]; then
            yarn release
          else
            echo "Apple signing secrets are missing/invalid; building unsigned macOS artifacts."
            unset CSC_LINK CSC_KEY_PASSWORD CSC_NAME AC_USERNAME AC_PASSWORD AC_TEAM_ID
            CSC_IDENTITY_AUTO_DISCOVERY=false yarn release
          fi

  Windows:
    runs-on: windows-2022
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@master
      - uses: actions/setup-node@master
        with:
          node-version: "18"
      - name: Sync app version with release tag
        shell: powershell
        run: node .\scripts\sync-release-version.js "$env:GITHUB_REF_NAME"
      - name: Configure Node
        shell: powershell
        run: |
          # npm v9 doesn't allow custom config parameters (i.e. node_gyp) anymode, so we have to downgrade it to v8
          npm install -g npm@8  
          npm install -g node-gyp@latest
          npm prefix -g | % {npm config set node_gyp "$_\node_modules\node-gyp\bin\node-gyp.js"}
      - name: Install dependencies
        run: yarn install --immutable
      - name: Build and Release
        shell: powershell
        run: |
          if (($env:WIN_CSC_LINK -and $env:WIN_CSC_KEY_PASSWORD) -or ($env:CSC_LINK -and $env:CSC_KEY_PASSWORD)) {
            yarn release
          } else {
            Write-Host "Windows signing secrets are missing/invalid; building unsigned Windows artifacts."
            Remove-Item Env:WIN_CSC_LINK -ErrorAction SilentlyContinue
            Remove-Item Env:WIN_CSC_KEY_PASSWORD -ErrorAction SilentlyContinue
            Remove-Item Env:CSC_LINK -ErrorAction SilentlyContinue
            Remove-Item Env:CSC_KEY_PASSWORD -ErrorAction SilentlyContinue
            Remove-Item Env:CSC_NAME -ErrorAction SilentlyContinue
            $env:CSC_IDENTITY_AUTO_DISCOVERY = "false"
            yarn release
          }
