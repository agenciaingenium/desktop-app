<!doctype html>
<html>
<head>
  <script src="../../../node_modules/mermaid/dist/mermaid.min.js"></script>
</head>
<body>
<div id="container"></div>
<script>
  // CLI window uses contextBridge (window.station) for IPC
  const mmds = window.station.getGlobal('sharedObject').mmds;
  const container = document.querySelector("#container");

  mermaid.initialize({
    theme: 'default',
  });

  const generateSVG = (input) => {
    const output = input.split('.').slice(0, -1).join('.') + '.svg';

    container.innerHTML = window.station.fs.readFileSync(input, 'utf-8');
    container.removeAttribute('data-processed');
    window.mermaid.init(undefined, container);
    window.station.fs.writeFileSync(output, container.innerHTML);
  };

  document.addEventListener(
    'DOMContentLoaded', () => {
      mmds.forEach(generateSVG);
      window.station.app.exit();
    },
    false
  );
</script>
</body>
</html>
