appId: org.getstation.DesktopApp

# When STATION_DEV=1 is set in the environment, build a parallel "Station Dev"
# bundle with a separate userData directory so the development build can
# coexist with the production install without overwriting its SQLite db,
# cookies, dock order, or any user state. Set automatically by the
# `yarn build:dev` / `yarn release:dev` scripts.
productName: Station

publish:
  provider: 'github'

asar: true
asarUnpack:
  - 'node_modules/**/*.{node,dll}'
  - 'node_modules/uuid/**/*'
  - 'worker-preload.js'

afterPack: '../../scripts/after-pack.js'
# afterSign: '../../scripts/notarize.js'

directories:
  output: ../../release

protocols:
  name: Station
  schemes:
  - station

dmg:
  sign: true
  contents:
  - x: 410
    y: 150
    type: link
    path: '/Applications'
  - x: 130
    y: 150
    type: file

mac:
  target:
    - target: dir
      arch:
        - arm64
  artifactName: ${productName}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false
  category: public.app-category.tools
  entitlements: 'build/entitlements.mac.plist'
  entitlementsInherit: 'build/entitlements.mac.plist'
  singleArchFiles: '*'
  extendInfo:
    NSCameraUsageDescription: 'Station necesita acceso a la cámara para videollamadas dentro de tus aplicaciones.'
    NSMicrophoneUsageDescription: 'Station necesita acceso al micrófono para llamadas y notas de voz dentro de tus aplicaciones.'
    NSAudioCaptureUsageDescription: 'Station necesita capturar audio para llamadas y notas de voz dentro de tus aplicaciones.'
  
# win:
#   target:
#     - nsis
#   artifactName: ${productName}-Setup.${ext}
#   verifyUpdateCodeSignature: false

# linux:
#   target:
#     - AppImage
#     - deb
#     - rpm
#   category: Network
#   artifactName: ${productName}-${arch}.${ext}

extraResources:
  - from: '../../.env.production'
    to: '.env.production'
  - from: 'src/static/icon-app.png'
    to: 'icon-app.png'

files:
  - '!**/*.map'
  - from: 'src/static/icon--provider'
    to: 'static/icon--provider'
    filter:
      - '**/*'
  - from: 'src/static/illustrations'
    to: 'static/illustrations'
  - from: 'src/static/logos'
    to: 'static/logos'
  - from: 'src/static/social-network'
    to: 'static/social-network'
  - from: 'src/static/animations'
    to: 'static/animations'
